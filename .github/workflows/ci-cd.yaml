name: C/C++ CI/CD Pipeline

on:
  push:
    branches: [main, development, "fix/*", "feat/*"]
  pull_request:
    branches: [main, development]

permissions:
  contents: write

jobs:
  lint-format:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jidicula/clang-format-action@v4.11.0
        with:
          clang-format-version: '17'
          check-path: '.'

  build-windows-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WiX Toolset
        run: choco install wixtoolset -y
      - name: Install dependencies via vcpkg
        run: C:\vcpkg\vcpkg install
        shell: cmd
      - name: Configure CMake
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        env:
          VCPKG_ROOT: C:\vcpkg
      - run: cmake --build build --config Release
      - name: Build Installer
        run: cpack -C Release -G WIX
        working-directory: build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Vidi-*.msi
          tag_name: v0.2-alpha-${{ github.run_number }}
          name: Release v0.2-alpha (Build ${{ github.run_number }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}