name: C/C++ CI/CD Pipeline

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  # ==============================================================================
  # 1. JOB UNTUK LINTING / CEK FORMAT KODE (Berjalan di Luar Branch Main)
  # ==============================================================================
  lint-format:
    if: github.ref != 'refs/heads/main' && github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Clang-Format Style Check
        uses: jidicula/clang-format-action@v4.11.0
        continue-on-error: true 
        with:
          clang-format-version: '17'
          check-path: '.'

  # ==============================================================================
  # 2. JOB UNTUK BUILD WINDOWS (Wajib Berjalan di Semua Branch & PR untuk Uji Kompilasi)
  # ==============================================================================
  build-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Menggunakan PowerShell valid untuk mendaftarkan PATH NSIS ke runner Windows GitHub
      - name: Install NSIS Compiler and Update PATH
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup MSVC Compiler & MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Build Installer Package (CPack)
        run: |
          cd build
          cpack -C Release

      # STEP INI HANYA JALAN JIKA KODE SUDAH RESMI DI-MERGE KE BRANCH MAIN
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Vidi-*.exe
          tag_name: v0.1-alpha-${{ github.run_number }}
          name: Release v0.1-alpha (Build ${{ github.run_number }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
